[project]
name = "horus_docker"
description = "A custom plugin for the Horus runtime, providing additional functionality and integrations."
requires-python = ">=3.13"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = ["horus-runtime>=0.2.0", "horus-resource-monitor"]
dynamic = ["version"]

# ================
# Plugin entry-points
# ================
[project.entry-points."horus.executor"]
docker = "horus_docker.executor.docker"

[project.entry-points."horus.resource_probe"]
container = "horus_docker.probe"

# ================

# TEMPORARY: pins the unmerged branches that introduce ResourceScope (horus-runtime)
# and the scope-driven resource-probe framework (horus-resource-monitor).
# Repoint at released versions (and bump the dependency specifiers above)
# before these branches are merged.
[tool.uv.sources]
horus-runtime = { git = "https://github.com/temple-compute/horus-runtime", rev = "353eb7779d731e11d37488819e59fa978d706a95" }
horus-resource-monitor = { git = "https://github.com/temple-compute/horus-resource-monitor", rev = "adc8329b35f569242595cc959a59311e499d3cad" }

[dependency-groups]
dev = [
  "babel~=2.0",
  "licenseheaders~=0.8",
  "mypy~=1.19",
  "pre_commit~=4.0",
  "pytest~=9.0",
  "pytest-asyncio~=1.3.0",
  "pytest-cov~=7.0",
  "ruff~=0.15",
  "types-PyYAML~=6.0",
  "uv-dynamic-versioning>=0.14.0",
]

[build-system]
requires = ["hatchling>=1.29,<2.0", "uv-dynamic-versioning>=0.14.0,<1.0"]
build-backend = "hatchling.build"

[tool.coverage.run]
source = ["horus_docker"]

[tool.coverage.report]
omit = ["tests/*"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build]
artifacts = ["src/horus_docker/locale/**/LC_MESSAGES/*.mo"]

[tool.hatch.build.targets.wheel]
packages = ["src/horus_docker"]

[tool.mypy]
python_version = "3.13"
strict = true
exclude = ["build", "dist"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
addopts = """
    --verbose
    --cov=src/horus_docker
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=90
"""
minversion = "7.0"
python_classes = ["Test*"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 79
target-version = "py313"
exclude = [".git", ".venv", "build", "dist", "__pycache__"]

[tool.ruff.lint]
select = [
  "D",  # pydocstyle
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "N",  # pep8-naming
  "UP",  # pyupgrade
  "B",  # flake8-bugbear
  "PL",  # pylint
  "RUF",  # ruff-specific
  "ARG",  # ruff-arglint
  "SLF",  # ruff-slf
]
extend-select = ["T201"]  # Prevent use of print()

ignore = [
  "E203",  # Whitespace before ':', conflicts with formatter
  "D104",  # Missing docstring in __init__ (often redundant)
  "D205",  # 1 blank line required between summary line and description
  "D212",  # Multi-line docstring summary should start at the first line
  "D200",  # One-line docstring should fit on one line
  "PLR2004"  # Magic numbers are ok
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["SLF001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.uv-dynamic-versioning]
fallback-version = "0.0.1"
